<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Viaoda+Libre&amp;display=swap');
      .dm-text {
        font-family: 'Viaoda Libre', 'Playfair Display', Georgia, serif;
        font-weight: 400;
        fill: #000000;
        text-anchor: middle;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Organic 4-lobed badge shape -->
  <path
    d="M 160,50 
       C 195,20 250,20 275,48 
       C 300,75 300,125 270,160 
       C 300,195 300,245 275,272 
       C 250,300 195,300 160,270 
       C 125,300 70,300 45,272 
       C 20,245 20,195 50,160 
       C 20,125 20,75 45,48 
       C 70,20 125,20 160,50 Z"
    fill="#3ee04e"
    stroke="#000000"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Text lines -->
  <text x="160" y="105" class="dm-text" font-size="22" letter-spacing="1">ENVÍAME UN DM</text>
  <text x="160" y="145" class="dm-text" font-size="24" letter-spacing="1.5">CON LA</text>
  <text x="160" y="190" class="dm-text" font-size="27" letter-spacing="2">CAPTURA</text>
  <text x="160" y="232" class="dm-text" font-size="21" letter-spacing="0.5">DE TU RESULTADO</text>

  <!-- Magic wand graphic -->
  <g transform="translate(160, 260) scale(0.95)">
    <!-- Sparkle swirl -->
    <path d="M-15,-6 C-18,-14 -12,-20 -2,-18 C6,-16 12,-8 10,2 C8,10 -2,12 -8,8" fill="none" stroke="#ffff00" stroke-width="2.5" opacity="0.9" />
    
    <!-- Stars -->
    <path d="M8,-18 L10,-12 L16,-10 L10,-8 L8,-2 L6,-8 L0,-10 L6,-12 Z" fill="#ffd700" />
    <path d="M-12,-16 L-10,-12 L-6,-11 L-10,-10 L-12,-6 L-14,-10 L-18,-11 L-14,-12 Z" fill="#ffd700" transform="scale(0.7) translate(-10, -10)" />
    <circle cx="8" cy="4" r="2" fill="#ffd700" />

    <!-- Wand body -->
    <line x1="-14" y1="14" x2="6" y2="-6" stroke="#4a4a4a" stroke-width="4.5" stroke-linecap="round" />
    <!-- Wand tip -->
    <line x1="6" y1="-6" x2="13" y2="-13" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
