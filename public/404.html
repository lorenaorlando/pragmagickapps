<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRAGMAGICK.APP</title>
    <meta name="description" content="Tarot Reading App Prototype" />
    <meta property="og:title" content="PRAGMAGICK.APP" />
    <meta property="og:description" content="Tarot Reading App Prototype" />
    <meta property="og:type" content="website" />
    <link rel="icon" id="favicon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/jpeg" href="https://sandboxlandia.online/wp-content/uploads/2026/09/PRAGMAGICKA_LOGO_YELLOW.jpg" />
    <link rel="apple-touch-icon" href="https://sandboxlandia.online/wp-content/uploads/2026/09/PRAGMAGICKA_LOGO_YELLOW.jpg" />
    <script>
      (function() {
        var img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = function() {
          var canvas = document.createElement('canvas');
          canvas.width = 64;
          canvas.height = 64;
          var ctx = canvas.getContext('2d');
          if (ctx) {
            ctx.beginPath();
            ctx.arc(32, 32, 32, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();
            ctx.drawImage(img, 0, 0, 64, 64);
            var faviconLink = document.getElementById('favicon');
            if (faviconLink) {
              faviconLink.type = 'image/png';
              faviconLink.href = canvas.toDataURL('image/png');
            }
          }
        };
        img.src = 'https://sandboxlandia.online/wp-content/uploads/2026/09/PRAGMAGICKA_LOGO_YELLOW.jpg';
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Viaoda+Libre&display=swap" rel="stylesheet">
  </head>
  <body class="bg-stone-900 text-stone-900 antialiased selection:bg-amber-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
